schema_version: "2"

robot:
  id: "hiyelx-mock-rover-01"
  name: "HIYELX Canonical Simulation Rover"
  version: "0.1.0"
  description: "A 4-component mock robot demonstrating the heterogeneous component pipeline."

runtime:
  tick_rate_hz: 50.0
  log_level: "INFO"
  history_retention_days: 7

components:
  - id: "wheel_encoder"
    category: "feedback"
    model: "mock.encoder"
    settings:
      resolution: 4096

  - id: "drive_motor"
    category: "actuator"
    model: "mock.motor"
    depends_on:
      - "wheel_encoder"
    settings:
      max_rpm: 300.0

  - id: "base_imu"
    category: "spatial"
    model: "mock.imu"
    depends_on:
      - "drive_motor"
    settings:
      sample_rate_hz: 100.0

  - id: "front_camera"
    category: "vision"
    model: "mock.camera"
    depends_on:
      - "base_imu"
    settings:
      width: 640
      height: 480
      fps: 30
