name: Quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: pytest
        run: uv run pytest

      - name: Clean installed wheel smoke
        run: uv run python scripts/verify_clean_install.py

  macos-runtime-portability:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Focused runtime and Studio portability tests
        run: >-
          uv run pytest
          tests/unit/simulation/test_preview.py
          tests/unit/runtime/test_history.py
          tests/unit/runtime/test_control.py
          tests/unit/runtime/test_session_discovery.py
          tests/unit/studio/test_application.py
          tests/unit/studio/test_host.py
          tests/unit/studio/test_telemetry_stream.py
          tests/unit/project/test_project_engine.py
          tests/unit/manifests/test_manifest_engine.py
          tests/unit/test_cli.py
          tests/integration/test_runtime_cli.py
          tests/integration/test_studio_host.py
          tests/studio/test_static_shell.py
          tests/studio/test_host_client.py
          tests/studio/test_live_composition.py
          tests/studio/test_p1_preservation.py
          tests/unit/test_verify_clean_install.py

      - name: Clean installed wheel RTO-3 journey
        run: uv run python scripts/verify_clean_install.py

  studio-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: studio-app/pnpm-lock.yaml

      - name: Install Studio dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript strict typecheck
        run: pnpm typecheck

      - name: Studio Vitest suite
        run: pnpm test

      - name: Studio production build
        run: pnpm build
