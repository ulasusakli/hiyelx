name: Quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: pytest
        run: uv run pytest

      - name: Clean installed wheel smoke
        run: uv run python scripts/verify_clean_install.py

  macos-runtime-portability:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Focused runtime portability tests
        run: >-
          uv run pytest
          tests/unit/simulation/test_preview.py
          tests/unit/runtime/test_history.py
          tests/unit/runtime/test_control.py
          tests/unit/test_cli.py
          tests/integration/test_runtime_cli.py
          tests/unit/test_verify_clean_install.py

      - name: Clean installed wheel RTO-3 journey
        run: uv run python scripts/verify_clean_install.py
